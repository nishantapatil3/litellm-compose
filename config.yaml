# LiteLLM Configuration File
# Uncomment and customize as needed

model_list:
  # ============================================
  # Claude Code Models
  # These map official Claude model names to available backends
  # ============================================
  - model_name: claude-opus-5
    litellm_params:
      model: openrouter/minimax/minimax-m3:free
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      supports_function_calling: true
      supports_web_search: true
      supports_vision: true
      supports_audio_input: true
      cache_creation_input_token_cost: 0
      cache_read_input_token_cost: 0

  # - model_name: laguna-s-2.1:free
  #   litellm_params:
  #     model: openrouter/poolside/laguna-s-2.1:free
  #     api_key: os.environ/OPENROUTER_API_KEY
  #   model_info:
  #     supports_function_calling: true
  #     supports_web_search: true
  #     supports_vision: false
  #     cache_creation_input_token_cost: 0
  #     cache_read_input_token_cost: 0

  # ============================================
  # NVIDIA Nemotron Chat/Reasoning Models
  - model_name: nemotron-ultra
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: false
      supports_web_search: false
      cache_creation_input_token_cost: 0
      cache_read_input_token_cost: 0

  - model_name: nemotron-lightning
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      supports_function_calling: true
      supports_vision: false
      supports_web_search: false
      structured_output: true
      cache_creation_input_token_cost: 0
      cache_read_input_token_cost: 0

  # Embedding Models
  - model_name: nemotron-embed
    litellm_params:
      model: openrouter/nvidia/nemotron-3-embed-1b:free
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      supports_embeddings: true
      input_cost_per_token: 0
      output_cost_per_token: 0
      # OpenRouter requests for free models may be used to train/improve models
      supports_vision: false
      supports_function_calling: false
  # ============================================

# General settings
litellm_settings:
  drop_params: true
  modify_params: true
  set_verbose: false
  callbacks: []
  cache: true
  cache_params:
    type: redis
    namespace: litellm-cache
    ttl: 600
  require_auth_for_metrics_endpoint: false
  # Rate limiting to prevent key-guessing attacks
  global_max_parallel_requests: 100
  allowed_fails: 5
  cooldown_time: 600

guardrails:
  - guardrail_name: "no-file-input"
    litellm_params:
      guardrail: no_file_input_guardrail.NoFileInputGuardrail
      mode: "pre_call"
      default_on: true

# General settings
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  store_prompts_in_spend_logs: true
  use_x_forwarded_for: true
  # Security: enforce user param and fail closed on budget issues
  enforce_user_param: false
  fail_closed_budget_enforcement: true
  # Reject requests with invalid client-side metadata to prevent exploitation
  reject_clientside_metadata_tags: true
